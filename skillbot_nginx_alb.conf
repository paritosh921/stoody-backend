upstream skillbot_api {
    server 127.0.0.1:5001;
    keepalive 64;
}

upstream mentor_ai_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Map to check if request should be blocked
# Block only if: host is NOT api.stoody.in AND header is NOT valid
# This blocks direct ALB access but allows api.stoody.in traffic
map "$host:$http_x_origin_verify" $block_request {
    "~^api\.stoody\.in:"                          0;  # Allow api.stoody.in (any header)
    "~:StoodyOnlyCloudFront_7bh3K91!$"            0;  # Allow any host with valid header
    default                                        1;  # Block everything else
}

# Map to validate CORS origins (web + mobile apps)
map $http_origin $cors_origin {
    default "";
    "https://app.stoody.in"     $http_origin;
    "capacitor://localhost"     $http_origin;
    "ionic://localhost"         $http_origin;
    "http://localhost"          $http_origin;
    "https://localhost"         $http_origin;
}

# Single server block - Port 80 only (ALB handles SSL termination)
server {
    listen 80 default_server;
    server_name api.stoody.in _;

    client_max_body_size 64m;

    # ============================================================
    # CLOUDFRONT ORIGIN VERIFICATION
    # Block direct ALB access while allowing api.stoody.in
    # ============================================================
    
    # Simple health endpoint just for ALB (bypasses all checks)
    location = /alb-health {
        default_type text/plain;
        return 200 "ok";
    }

    # Internal location for forbidden responses
    location @forbidden {
        default_type text/plain;
        return 403 "Forbidden - Direct access not allowed";
    }

    # Health Check Endpoint (for CloudFront/API health checks)
    location /health {
        # *** CORS PREFLIGHT - Nginx handles OPTIONS only ***
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,X-Requested-With,DNT,User-Agent,If-Modified-Since,Cache-Control,Range,X-App-Source,X-App-Version' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            return 204;
        }

        # Block direct ALB access (but allow api.stoody.in)
        error_page 418 = @forbidden;
        if ($block_request) {
            return 418;
        }

        proxy_pass http://skillbot_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        
        # Ensure Nginx handles CORS for actual responses and errors
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Credentials';
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # Disable caching
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # MentorAI full app
    location = /mentor-ai {
        error_page 418 = @forbidden;
        if ($block_request) {
            return 418;
        }

        proxy_pass http://mentor_ai_app/mentor-ai;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }

    location ^~ /mentor-ai/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,X-Requested-With,DNT,User-Agent,If-Modified-Since,Cache-Control,Range,X-Process-Time,X-App-Source,X-App-Version' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            return 204;
        }

        error_page 418 = @forbidden;
        if ($block_request) {
            return 418;
        }

        proxy_pass http://mentor_ai_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # Main API Proxy
    location / {
        # *** CORS PREFLIGHT - Nginx handles OPTIONS only ***
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,X-Requested-With,DNT,User-Agent,If-Modified-Since,Cache-Control,Range,X-Process-Time,X-App-Source,X-App-Version' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            return 204;
        }

        # Redirect HTTP to HTTPS *only* if the Load Balancer says it came in as HTTP
        # ALB sends X-Forwarded-Proto header to indicate original protocol
        if ($http_x_forwarded_proto = "http") {
            return 301 https://$host$request_uri;
        }

        # Block direct ALB access (but allow api.stoody.in)
        error_page 418 = @forbidden;
        if ($block_request) {
            return 418;
        }

        # Ensure Nginx handles CORS for actual responses and errors
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Credentials';
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # Regular Requests (POST/GET/etc): proxy to backend
        proxy_pass http://skillbot_api;
        proxy_http_version 1.1;

        # WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Headers - Use $http_x_forwarded_proto from ALB instead of $scheme
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Timeouts
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }
}

# NOTE: No port 443 server block!
# SSL termination is handled by AWS ALB
