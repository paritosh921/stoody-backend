name: Deploy Prod Backend

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "core/**"
      - "services/**"
      - "middleware/**"
      - "models/**"
      - "utils/**"
      - "main_async.py"
      - "config_async.py"
      - "mentorAI/**"
      - "stoody-book/**"
      - "scripts/run_tui.sh"
      - "requirements.txt"
      - "skillbot_nginx_alb.conf"
      - "ops/remote_deploy_python_service.sh"
      - ".github/workflows/deploy-prod-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEPLOY_BRANCH: ${{ github.ref_name }}
      PROD_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.PROD_DEPLOY_SSH_PRIVATE_KEY }}
      PROD_MAIN_BACKEND_HOST: ${{ vars.PROD_MAIN_BACKEND_HOST }}
      PROD_MAIN_BACKEND_USER: ${{ vars.PROD_MAIN_BACKEND_USER }}
      PROD_MAIN_BACKEND_PATH: ${{ vars.PROD_MAIN_BACKEND_PATH }}
      PROD_MAIN_BACKEND_VENV_PATH: ${{ vars.PROD_MAIN_BACKEND_VENV_PATH }}
      PROD_MAIN_BACKEND_SERVICE_MANAGER: ${{ vars.PROD_MAIN_BACKEND_SERVICE_MANAGER }}
      PROD_MAIN_BACKEND_SERVICE_NAME: ${{ vars.PROD_MAIN_BACKEND_SERVICE_NAME }}
      PROD_MAIN_BACKEND_HEALTHCHECK_URL: ${{ vars.PROD_MAIN_BACKEND_HEALTHCHECK_URL }}
      PROD_MENTOR_AI_PORT: ${{ vars.PROD_MENTOR_AI_PORT }}
      PROD_MENTOR_AI_BASE_PATH: ${{ vars.PROD_MENTOR_AI_BASE_PATH }}
      PROD_NGINX_SITE_PATH: ${{ vars.PROD_NGINX_SITE_PATH }}
      PROD_DEPLOY_SESSION_SECRET: ${{ secrets.PROD_DEPLOY_SESSION_SECRET }}
    steps:
      - name: Guard branch
        run: |
          case "${GITHUB_REF_NAME}" in
            main) ;;
            *)
              echo "This workflow only deploys from main."
              exit 1
              ;;
          esac

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax-check Python code
        shell: bash
        run: python -m compileall .

      - name: Validate backend deploy settings
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$PROD_DEPLOY_SSH_PRIVATE_KEY" ]]; then
            echo "Missing required GitHub secret: PROD_DEPLOY_SSH_PRIVATE_KEY"
            exit 1
          fi

          if [[ -z "$PROD_DEPLOY_SESSION_SECRET" ]]; then
            echo "Missing required GitHub secret: PROD_DEPLOY_SESSION_SECRET"
            exit 1
          fi

          required=(
            "PROD_MAIN_BACKEND_HOST"
            "PROD_MAIN_BACKEND_USER"
            "PROD_MAIN_BACKEND_PATH"
            "PROD_MAIN_BACKEND_VENV_PATH"
            "PROD_MAIN_BACKEND_SERVICE_MANAGER"
            "PROD_MAIN_BACKEND_SERVICE_NAME"
            "PROD_MAIN_BACKEND_HEALTHCHECK_URL"
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub variable: $name"
              exit 1
            fi
          done

      - name: Configure SSH access
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PROD_DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/prod_deploy_key
          chmod 600 ~/.ssh/prod_deploy_key

          ssh-keyscan -H "$PROD_MAIN_BACKEND_HOST" > ~/.ssh/known_hosts

      - name: Deploy backend to prod
        shell: bash
        run: |
          set -euo pipefail

          scp -i ~/.ssh/prod_deploy_key -o StrictHostKeyChecking=yes \
            ops/remote_deploy_python_service.sh \
            "${PROD_MAIN_BACKEND_USER}@${PROD_MAIN_BACKEND_HOST}:/tmp/remote_deploy_python_service.sh"

          scp -i ~/.ssh/prod_deploy_key -o StrictHostKeyChecking=yes \
            skillbot_nginx_alb.conf \
            "${PROD_MAIN_BACKEND_USER}@${PROD_MAIN_BACKEND_HOST}:/tmp/skillbot_nginx_alb.conf"

          ssh -i ~/.ssh/prod_deploy_key -o StrictHostKeyChecking=yes \
            "${PROD_MAIN_BACKEND_USER}@${PROD_MAIN_BACKEND_HOST}" \
            "chmod +x /tmp/remote_deploy_python_service.sh && \
            MENTOR_AI_PORT='${PROD_MENTOR_AI_PORT}' \
            MENTOR_AI_BASE_PATH='${PROD_MENTOR_AI_BASE_PATH}' \
            NGINX_SITE_PATH='${PROD_NGINX_SITE_PATH}' \
            bash /tmp/remote_deploy_python_service.sh \
            '${PROD_MAIN_BACKEND_PATH}' '${DEPLOY_BRANCH}' '${PROD_MAIN_BACKEND_VENV_PATH}' 'requirements.txt' '${PROD_MAIN_BACKEND_SERVICE_MANAGER}' '${PROD_MAIN_BACKEND_SERVICE_NAME}' '${PROD_MAIN_BACKEND_HEALTHCHECK_URL}' '5'"

      - name: Validate upload security runtime controls
        shell: bash
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/prod_deploy_key -o StrictHostKeyChecking=yes \
            "${PROD_MAIN_BACKEND_USER}@${PROD_MAIN_BACKEND_HOST}" \
            "cd '${PROD_MAIN_BACKEND_PATH}' && \
            UPLOAD_SCAN_REQUIRED=true \
            UPLOAD_AV_FAIL_CLOSED=true \
            CLAMAV_SOCKET=/var/run/clamav/clamd.ctl \
            CLAMAV_SOCKET_OWNER=clamav \
            CLAMAV_SOCKET_GROUP=clamav \
            CLAMAV_SOCKET_MODE=660 \
            UPLOAD_PRIVATE_LOCAL_DIR=/var/lib/stoody/uploads \
            UPLOAD_CLEANUP_TIMER_UNIT=stoody-upload-cleanup.timer \
            BACKEND_SERVICE_USER='${PROD_MAIN_BACKEND_USER}' \
            BACKEND_HEALTH_URL='${PROD_MAIN_BACKEND_HEALTHCHECK_URL}' \
            '${PROD_MAIN_BACKEND_VENV_PATH}/bin/python' scripts/validate_upload_security_deploy.py \
            --status-output '${PROD_MAIN_BACKEND_PATH}/data/upload_deploy_validation_status.json'"

      - name: Invalidate existing sessions after prod deploy
        shell: bash
        run: |
          set -euo pipefail

          remote_curl_command="$(python - <<'PY'
          import os
          import shlex
          from urllib.parse import urlsplit

          health_url = os.environ["PROD_MAIN_BACKEND_HEALTHCHECK_URL"]
          parsed = urlsplit(health_url)
          if not parsed.scheme or not parsed.netloc:
              raise SystemExit("Invalid PROD_MAIN_BACKEND_HEALTHCHECK_URL")
          invalidate_url = f"{parsed.scheme}://{parsed.netloc}/api/v1/auth/invalidate-all-sessions"
          deploy_secret_header = f"X-Deploy-Secret: {os.environ['PROD_DEPLOY_SESSION_SECRET']}"
          print(
              "curl -fsS -X POST "
              + shlex.quote(invalidate_url)
              + " -H "
              + shlex.quote(deploy_secret_header)
          )
          PY
          )"

          echo "Invalidating existing JWT sessions on prod backend"
          ssh -i ~/.ssh/prod_deploy_key -o StrictHostKeyChecking=yes \
            "${PROD_MAIN_BACKEND_USER}@${PROD_MAIN_BACKEND_HOST}" \
            "$remote_curl_command"
