upstream skillbot_api {
    server 127.0.0.1:5001;
    keepalive 64;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirect HTTP to HTTPS for api.stoody.in
server {
    listen 80;
    server_name api.stoody.in;
    return 301 https://$host$request_uri;
}

# Catch-all for HTTP (Optional, good for safety)
server {
    listen 80 default_server;
    server_name _;
    return 301 https://api.stoody.in$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl;
    server_name api.stoody.in;

    ssl_certificate /etc/letsencrypt/live/api.stoody.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.stoody.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    # Health Check Endpoint
    location /health {
        proxy_pass http://skillbot_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable caching
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Main API Proxy
    location / {
        proxy_pass http://skillbot_api;
        proxy_http_version 1.1;

        # WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }
}
