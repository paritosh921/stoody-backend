openapi: "3.1.0"
info:
  title: ExamPen Student BFF API
  version: "2.0.0"
  description: |
    Read-oriented student and parent views over published ExamPen outcomes.
    Parent scope remains derived from Stoody relationships.

    **IMPLEMENTATION STATUS (2026-05-02): MOUNTED.** Router at `/api/v1/student` in `evalpen_student_bff_async.py`.
    The frontend consumes richer payloads than this spec currently documents (per-question scores
    with reference answers, recheck status). Spec may need expansion to match actual response shapes.
servers:
  - url: /
security:
  - StoodyBearer: []
paths:
  /api/v1/student/exams:
    get:
      summary: List visible exams
      responses:
        "200":
          description: Student exam cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/StudentExamCard"
  /api/v1/student/exams/{exam_id}/scores:
    get:
      summary: Get published score summary
      parameters:
        - name: exam_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Published score summary
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    StoodyBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    StudentExamCard:
      type: object
      required: [exam_id, title, exam_type, result_status, recheck_count, open_recheck_count]
      properties:
        exam_id:
          type: string
        title:
          type: string
        exam_type:
          type: string
          enum: [dcr, pcr]
        result_status:
          type: string
          enum: [published, under_review]
          description: Under review while any student recheck request is unresolved.
        recheck_count:
          type: integer
          minimum: 0
          description: Total recheck requests, including resolved history.
        open_recheck_count:
          type: integer
          minimum: 0
          description: Requests that have not reached an explicit resolved state.
