openapi: "3.1.0"
info:
  title: ExamPen Stroke Ingest API
  version: "1.0.0"
  description: |
    Chunk-oriented ingest API used by the hub upload path.
    Upload acknowledgement is per chunk. Hub marks a pen uploaded only when all chunks
    are acknowledged.
servers:
  - url: /
security:
  - StoodyBearer: []
paths:
  /api/v1/strokes/ingest:
    post:
      summary: Ingest one uploaded chunk from the hub
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrokeChunkUploadRequest"
      responses:
        "202":
          description: Chunk accepted or deduplicated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestAck"
  /api/v1/exams/{exam_id}/upload-status:
    get:
      summary: Return per-pen upload progress for reconciliation
      parameters:
        - name: exam_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Upload reconciliation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamUploadStatus"
components:
  securitySchemes:
    StoodyBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    StrokeChunkUploadRequest:
      type: object
      required:
        [exam_id, pen_mac, chunk_index, total_chunks, payload_base64, checksum_crc32, upload_path, idempotency_key]
      properties:
        exam_id:
          type: string
          format: uuid
        pen_mac:
          type: string
        chunk_index:
          type: integer
        total_chunks:
          type: integer
        payload_base64:
          type: string
        checksum_crc32:
          type: string
        upload_path:
          type: string
          enum: [wifi, mobile]
        idempotency_key:
          type: string
          description: Usually `{exam_id}:{pen_mac}:{chunk_index}`
        binding_status:
          type: string
          enum: [unknown, provisional, confirmed, rejected]
    IngestAck:
      type: object
      required: [exam_id, pen_mac, chunk_index, accepted, deduplicated, next_expected_chunk]
      properties:
        exam_id:
          type: string
          format: uuid
        pen_mac:
          type: string
        chunk_index:
          type: integer
        accepted:
          type: boolean
        deduplicated:
          type: boolean
        next_expected_chunk:
          type: integer
        pen_upload_complete:
          type: boolean
    ExamUploadStatus:
      type: object
      required: [exam_id, pens]
      properties:
        exam_id:
          type: string
          format: uuid
        pens:
          type: array
          items:
            $ref: "#/components/schemas/PenUploadStatus"
    PenUploadStatus:
      type: object
      required: [pen_mac, acked_chunks, total_chunks, complete]
      properties:
        pen_mac:
          type: string
        acked_chunks:
          type: array
          items:
            type: integer
        total_chunks:
          type: integer
        complete:
          type: boolean
