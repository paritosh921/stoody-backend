openapi: "3.1.0"
info:
  title: ExamPen Analytics API
  version: "1.0.0"
  description: Percentiles, leaderboard, class statistics, and export metadata.
servers:
  - url: /
security:
  - StoodyBearer: []
paths:
  /api/v1/analytics/exams/{exam_id}/leaderboard:
    get:
      summary: Get leaderboard rows for one exam
      parameters:
        - name: exam_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/LeaderboardRow"
  /api/v1/analytics/exams/{exam_id}/class-stats:
    get:
      summary: Get class-level statistics for one exam
      parameters:
        - name: exam_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Class statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassStats"
  /api/v1/analytics/students/{student_id}/performance:
    get:
      summary: Get longitudinal performance for one student
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Student trend data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentPerformance"
  /api/v1/analytics/exams/{exam_id}/export:
    get:
      summary: Get export metadata for a generated report
      parameters:
        - name: exam_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [csv, pdf]
      responses:
        "200":
          description: Export metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResult"
components:
  securitySchemes:
    StoodyBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LeaderboardRow:
      type: object
      required: [rank, student_id, score, percentile]
      properties:
        rank:
          type: integer
        student_id:
          type: string
        student_name:
          type: string
        score:
          type: number
        percentile:
          type: number
    ClassStats:
      type: object
      required: [mean, median, std_dev, pass_rate]
      properties:
        mean:
          type: number
        median:
          type: number
        std_dev:
          type: number
        pass_rate:
          type: number
        question_difficulty:
          type: array
          items:
            type: object
            required: [question_id, avg_score]
            properties:
              question_id:
                type: string
              avg_score:
                type: number
    StudentPerformance:
      type: object
      required: [student_id, history]
      properties:
        student_id:
          type: string
        history:
          type: array
          items:
            type: object
            required: [exam_id, score, percentile]
            properties:
              exam_id:
                type: string
                format: uuid
              score:
                type: number
              percentile:
                type: number
        strengths:
          type: array
          items:
            type: string
        weaknesses:
          type: array
          items:
            type: string
    ExportResult:
      type: object
      required: [exam_id, format, download_uri]
      properties:
        exam_id:
          type: string
          format: uuid
        format:
          type: string
          enum: [csv, pdf]
        download_uri:
          type: string
          format: uri
