openapi: "3.1.0"
info:
  title: ExamPen Chat API
  version: "1.0.0"
  description: Append-only messaging API for teacher-student exam threads.
servers:
  - url: /
security:
  - StoodyBearer: []
paths:
  /api/v1/chat/threads/{exam_id}/{other_user_id}:
    get:
      summary: Get one chat thread
      parameters:
        - name: exam_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: other_user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Thread messages
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatMessage"
    post:
      summary: Append a new message to the thread
      parameters:
        - name: exam_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: other_user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendChatMessageRequest"
      responses:
        "201":
          description: Message appended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
  /api/v1/chat/threads/{exam_id}/{other_user_id}/read:
    post:
      summary: Mark the thread as read for the current user
      parameters:
        - name: exam_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: other_user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Read receipt persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadReceipt"
components:
  securitySchemes:
    StoodyBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ChatMessage:
      type: object
      required: [message_id, sender_id, recipient_id, exam_id, content, sent_at]
      properties:
        message_id:
          type: string
          format: uuid
        sender_id:
          type: string
        recipient_id:
          type: string
        exam_id:
          type: string
          format: uuid
        content:
          type: string
        attachment_uri:
          type: string
          format: uri
        sent_at:
          type: string
          format: date-time
        read_at:
          type: string
          format: date-time
    SendChatMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
        attachment_uri:
          type: string
          format: uri
    ReadReceipt:
      type: object
      required: [exam_id, other_user_id, read_at]
      properties:
        exam_id:
          type: string
          format: uuid
        other_user_id:
          type: string
        read_at:
          type: string
          format: date-time
