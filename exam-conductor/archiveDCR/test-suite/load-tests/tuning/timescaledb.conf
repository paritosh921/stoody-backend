# ==========================================================================
# TimescaleDB — Tuning for ExamPen Stroke Storage
# ==========================================================================
#
# TimescaleDB extends PostgreSQL for time-series data. ExamPen uses it
# for the stroke processing pipeline:
#   svc-stroke-proc writes normalized strokes -> TimescaleDB hypertable
#   svc-doc-assembly reads strokes for page rendering
#   svc-teacher-bff / svc-student-bff read aggregated data
#
# Workload:
#   - Burst writes during exam upload (10K students x 336KB = 3.3GB)
#   - Each stroke chunk produces ~600 rows in the strokes hypertable
#   - Total rows per exam: 10K students x 40 chunks x 600 rows = 240M rows
#   - Reads are point lookups: WHERE exam_id = X AND student_id = Y
#
# These are RECOMMENDATIONS. Apply on top of the postgresql.conf tuning.
#
# Reference: CLAUDE.md §Tech Stack, FAILURE_MITIGATION_REGISTER.md §A8.4
# ==========================================================================


# --------------------------------------------------------------------------
# TimescaleDB-specific GUC parameters
# --------------------------------------------------------------------------

# Max background workers for TimescaleDB.
# Includes: chunk creation, compression, retention, continuous aggregates.
timescaledb.max_background_workers = 8

# Telemetry: disable in production.
timescaledb.telemetry_level = off

# License: community edition is sufficient for ExamPen.
# Set to 'apache' for community features only.
timescaledb.license = apache


# ==========================================================================
# Hypertable design (apply via SQL migration)
# ==========================================================================
#
# -- 1. Create the strokes hypertable
# CREATE TABLE strokes (
#     id              BIGINT GENERATED ALWAYS AS IDENTITY,
#     exam_id         UUID NOT NULL,
#     student_id      UUID NOT NULL,
#     pen_mac         TEXT NOT NULL,
#     chunk_index     INT NOT NULL,
#     frame_index     INT NOT NULL,
#     tenant_id       UUID NOT NULL,
#     book_type       SMALLINT NOT NULL,
#     page_number     SMALLINT NOT NULL,
#     x_mm            REAL NOT NULL,        -- mm (pen units / 10)
#     y_mm            REAL NOT NULL,        -- mm (pen units / 10, Y-inverted)
#     pressure        SMALLINT NOT NULL,
#     pen_prop        SMALLINT NOT NULL,
#     ts_pen          BIGINT NOT NULL,      -- pen-local timestamp
#     created_at      TIMESTAMPTZ NOT NULL DEFAULT NOW(),
#
#     -- Idempotency key components
#     UNIQUE (exam_id, pen_mac, chunk_index, frame_index)
# );
#
# -- Convert to hypertable, partitioned by created_at.
# -- Chunk interval: 1 hour. During a burst, all data lands in the
# -- current chunk. This gives optimal write performance.
# SELECT create_hypertable(
#     'strokes',
#     'created_at',
#     chunk_time_interval => INTERVAL '1 hour',
#     if_not_exists => TRUE
# );


# ==========================================================================
# Chunk size tuning
# ==========================================================================
#
# Chunk interval: 1 hour
#   - During an exam burst (~30 min upload window), all strokes land
#     in 1 chunk. This maximizes write throughput (single chunk target).
#   - After the burst, new chunks are small (queries, not writes).
#
# Space partitioning (optional, for very large deployments):
#   SELECT add_dimension('strokes', 'tenant_id', number_partitions => 4);
#   This distributes tenant data across sub-chunks. Only useful if
#   single-tenant queries dominate AND you have >100 tenants.
#
# To change chunk interval retroactively:
#   SELECT set_chunk_time_interval('strokes', INTERVAL '1 hour');


# ==========================================================================
# Compression policies
# ==========================================================================
#
# Strokes are write-once, read-rarely (only during doc-assembly and
# review). Compression dramatically reduces storage.
#
# -- Enable compression on the hypertable
# ALTER TABLE strokes SET (
#     timescaledb.compress,
#     timescaledb.compress_segmentby = 'exam_id, student_id',
#     timescaledb.compress_orderby = 'created_at ASC, page_number ASC, frame_index ASC'
# );
#
# -- Compress chunks older than 2 hours (after burst is fully processed)
# SELECT add_compression_policy('strokes', INTERVAL '2 hours');
#
# Compression rationale:
#   - segmentby = exam_id, student_id: Queries always filter by these.
#     Compressed chunks store segments per (exam, student) pair, so
#     decompression only touches the relevant segment.
#   - orderby = created_at, page_number, frame_index: Maintains temporal
#     and spatial locality within each segment for efficient range scans.
#   - 2 hours after ingestion: Gives the pipeline time to fully process
#     before compressing. Compressed chunks cannot be updated (only
#     inserted into if using TimescaleDB 2.11+).
#
# Expected compression ratio: 10-15x for coordinate data (many repeated
# bookType, pageNumber values; pressure values cluster).
#
# Storage estimate (uncompressed):
#   240M rows x ~80 bytes/row = ~19.2 GB per exam batch
# Storage estimate (compressed at 12x):
#   ~1.6 GB per exam batch


# ==========================================================================
# Retention policies
# ==========================================================================
#
# Stroke data retention depends on regulatory requirements (DPDPA).
# Default: 2 years (configurable per tenant via svc-auth).
#
# -- Drop stroke chunks older than 2 years
# SELECT add_retention_policy('strokes', INTERVAL '2 years');
#
# -- For audit compliance, consider moving to cold storage before drop:
# -- 1. Archive compressed chunks to S3/MinIO (pg_dump per chunk)
# -- 2. Then apply retention drop
#
# To check current policies:
#   SELECT * FROM timescaledb_information.jobs
#   WHERE proc_name IN ('policy_compression', 'policy_retention');


# ==========================================================================
# Continuous aggregates (materialized views for BFF queries)
# ==========================================================================
#
# Teacher and student BFF endpoints need aggregated data, not raw strokes.
# Continuous aggregates pre-compute these efficiently.
#
# -- Stroke count per student per exam (for upload-status and progress)
# CREATE MATERIALIZED VIEW stroke_counts_per_student
# WITH (timescaledb.continuous) AS
# SELECT
#     exam_id,
#     student_id,
#     tenant_id,
#     time_bucket('1 hour', created_at) AS bucket,
#     COUNT(*) AS stroke_count,
#     COUNT(DISTINCT page_number) AS pages_written,
#     MAX(created_at) AS last_stroke_at
# FROM strokes
# GROUP BY exam_id, student_id, tenant_id, bucket;
#
# -- Refresh policy: every 5 minutes, looking back 2 hours
# SELECT add_continuous_aggregate_policy('stroke_counts_per_student',
#     start_offset => INTERVAL '2 hours',
#     end_offset   => INTERVAL '5 minutes',
#     schedule_interval => INTERVAL '5 minutes'
# );


# ==========================================================================
# Index recommendations
# ==========================================================================
#
# TimescaleDB automatically creates a composite index on (created_at)
# as the hypertable dimension. Add these for query patterns:
#
# -- Primary lookup pattern: fetch all strokes for a student's exam
# CREATE INDEX idx_strokes_exam_student
#     ON strokes (exam_id, student_id, page_number, frame_index);
#
# -- Tenant isolation (required for RLS performance)
# CREATE INDEX idx_strokes_tenant
#     ON strokes (tenant_id, exam_id);
#
# -- Idempotency check during ingestion
# -- (The UNIQUE constraint above already creates this index)
#
# -- Upload reconciliation: per-pen chunk status
# CREATE INDEX idx_strokes_pen_chunk
#     ON strokes (exam_id, pen_mac, chunk_index);


# ==========================================================================
# Performance monitoring queries
# ==========================================================================
#
# -- Check chunk sizes and compression status
# SELECT
#     hypertable_name,
#     chunk_name,
#     range_start,
#     range_end,
#     is_compressed,
#     before_compression_total_bytes,
#     after_compression_total_bytes
# FROM timescaledb_information.chunks
# WHERE hypertable_name = 'strokes'
# ORDER BY range_start DESC
# LIMIT 20;
#
# -- Check compression ratio
# SELECT
#     pg_size_pretty(before_compression_total_bytes) AS before,
#     pg_size_pretty(after_compression_total_bytes) AS after,
#     ROUND(before_compression_total_bytes::numeric /
#           NULLIF(after_compression_total_bytes, 0), 1) AS ratio
# FROM hypertable_compression_stats('strokes');
#
# -- Check continuous aggregate refresh status
# SELECT * FROM timescaledb_information.continuous_aggregate_stats;
#
# -- Check job status (compression, retention, cagg refresh)
# SELECT * FROM timescaledb_information.job_stats
# ORDER BY last_run_started_at DESC;
