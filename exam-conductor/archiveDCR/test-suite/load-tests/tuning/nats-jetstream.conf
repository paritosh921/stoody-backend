# ==========================================================================
# Consumer tuning recommendations
# ==========================================================================

# --- svc-stroke-proc consumer (primary bottleneck) ---
# nats consumer add STROKE_RAW stroke-proc-worker \
#   --filter "stroke.raw.>" \
#   --ack explicit \
#   --deliver all \
#   --max-deliver 5 \               # Retry up to 5 times
#   --ack-wait 30s \                # 30s to process before redelivery
#   --max-pending 1000 \            # Up to 1000 unacked messages in flight
#   --flow-control \                # Enable flow control for burst handling
#   --idle-heartbeat 15s \          # Detect dead consumers
#   --backoff "1s,5s,30s,120s,600s" # Exponential backoff on failure

# Key tuning notes for svc-stroke-proc consumer:
#
# - ack-wait 30s: Chunks are small (~8.4KB raw) but the processing
#   pipeline (dedup + normalize + TimescaleDB insert) can take time
#   under burst load. 30s gives enough headroom.
#
# - max-pending 1000: Allows high parallelism. Each svc-stroke-proc
#   instance can have up to 1000 messages in flight. With 3 replicas,
#   that is 3000 concurrent processing slots.
#
# - flow-control: Prevents NATS from overwhelming slow consumers.
#   The server will pause delivery when the consumer falls behind.
#
# - max-deliver 5: After 5 failed attempts, the message goes to a
#   dead-letter advisory. Monitor `$JS.EVENT.ADVISORY.CONSUMER.MAX_DELIVERIES`
#   for stuck messages.

# --- svc-ai-pipeline consumer ---
# nats consumer add PIPELINE_EVENTS ai-pipeline-worker \
#   --filter "page.ready.>" \
#   --ack explicit \
#   --max-deliver 3 \
#   --ack-wait 120s \               # AI processing is slower — 2 min timeout
#   --max-pending 50 \              # AI is GPU-bound, limit concurrency
#   --flow-control \
#   --idle-heartbeat 30s

# --- svc-score-engine consumer ---
# nats consumer add PIPELINE_EVENTS score-engine-worker \
#   --filter "ai.result.>" \
#   --ack explicit \
#   --max-deliver 5 \
#   --ack-wait 30s \
#   --max-pending 500 \
#   --flow-control \
#   --idle-heartbeat 15s


# ==========================================================================
# Monitoring alerts (Grafana/Prometheus thresholds)
# ==========================================================================
#
# Alert: NATS consumer lag > 10s
#   Query: jetstream_consumer_ack_pending{consumer="stroke-proc-worker"} > 5000
#   Action: Scale svc-stroke-proc replicas
#
# Alert: NATS stream storage > 80%
#   Query: jetstream_stream_bytes{stream="STROKE_RAW"} / 8589934592 > 0.8
#   Action: Investigate slow consumer or increase storage
#
# Alert: Message redelivery rate > 5%
#   Query: rate(jetstream_consumer_num_redelivered[5m]) / rate(jetstream_consumer_num_ack[5m]) > 0.05
#   Action: Check svc-stroke-proc health and DB connection pool
