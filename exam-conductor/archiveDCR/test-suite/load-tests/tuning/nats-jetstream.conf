http_port: 8222     # NATS monitoring endpoint


# ==========================================================================
# Stream definitions (apply via nats CLI or Terraform)
# ==========================================================================
#
# These are documented as comments because NATS streams are created via
# the nats CLI or programmatically, not in the server config file.
# Use `nats stream add` or the NATS management API.

# --- stroke.raw stream ---
# nats stream add STROKE_RAW \
#   --subjects "stroke.raw.>" \
#   --retention limits \
#   --max-msgs-per-subject 500000 \
#   --max-bytes 8589934592 \        # 8GB — holds 2x full burst
#   --max-age 24h \                 # Auto-purge after 24h
#   --storage file \                # File-backed for durability
#   --replicas 3 \                  # 3-way replication in cluster
#   --discard old \                 # Discard oldest when limit hit
#   --max-msg-size 1048576 \        # 1MB per message
#   --duplicate-window 24h \        # Dedup window for idempotency keys
#   --dupe-filter-size 1048576      # 1M entries in dedup filter

