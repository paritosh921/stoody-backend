# ==========================================================================
# NATS JetStream — Tuning for ExamPen Burst Load
# ==========================================================================
#
# Context: A8.4 peak load — 10K students x 336KB = 3.3GB stroke data burst.
# Stroke chunks flow: svc-stroke-ingest -> NATS -> svc-stroke-proc.
#
# These are RECOMMENDATIONS. Adjust based on actual hardware, observed
# metrics, and NATS monitoring dashboard.
#
# Reference: FAILURE_MITIGATION_REGISTER.md §A8.4
# ==========================================================================

# --- Server-level settings ---
server_name: exampen-nats-1

# Maximum memory the NATS server process can use.
# For 3.3GB burst + headroom for consumer state and internal buffers.
# Recommendation: 2x the expected burst size on the NATS node.
max_payload: 1048576    # 1MB max per message (chunks are ~11.5KB base64)

# --- JetStream configuration ---
jetstream {
    # Total memory available for JetStream streams and consumers.
    # Must accommodate the full burst in case consumers lag.
    # 3.3GB burst + 50% headroom = ~5GB.
    max_mem: 5368709120     # 5GB

    # Total file-based storage for streams that use file storage.
    # TimescaleDB is the durable store, so NATS file storage is a
    # safety net for consumer replay. Size for 2x burst.
    max_file: 10737418240   # 10GB

    # Storage directory for file-backed streams.
    store_dir: /data/nats/jetstream
}

# --- Cluster settings (if running clustered) ---
