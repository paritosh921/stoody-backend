# ==========================================================================
# PostgreSQL — Tuning for ExamPen Write-Heavy Workload
# ==========================================================================
#
# Target hardware profile (recommended minimum for production):
#   CPU:    8 cores
#   RAM:    32 GB
#   Disk:   NVMe SSD, 500GB+
#
# Workload characteristics:
#   - Write-heavy during exam ingestion (stroke.raw -> stroke.processed)
#   - Read-heavy during score viewing (teacher-bff, student-bff)
#   - Multi-tenant with RLS (tenant_id on every table)
#   - Event-sourced scoring (append-only score_events table)
#
# These are RECOMMENDATIONS. Use pgtune (https://pgtune.leopard.in.ua/)
# with your actual hardware specs as a starting point, then apply the
# ExamPen-specific adjustments below.
#
# Reference: CLAUDE.md §Tech Stack, FAILURE_MITIGATION_REGISTER.md §A8.4
# ==========================================================================


# --------------------------------------------------------------------------
# Connection settings
# --------------------------------------------------------------------------

# Max connections: each service gets a connection pool.
# 12 services x 10 connections/pool + 20 reserved = 140.
# Add headroom for monitoring, migrations, and admin.
max_connections = 200

# Superuser-reserved connections for emergency maintenance.
superuser_reserved_connections = 5


# --------------------------------------------------------------------------
# Memory
# --------------------------------------------------------------------------

# shared_buffers: 25% of total RAM.
# 32GB RAM -> 8GB. This is the main data cache.
shared_buffers = 8GB

# effective_cache_size: 75% of total RAM.
# Tells the planner how much memory the OS page cache provides.
effective_cache_size = 24GB

# work_mem: Per-sort/hash-join memory allocation.
# Conservative because many concurrent queries may each use this.
# 200 connections x 64MB = 12.8GB theoretical max — stays within bounds.
work_mem = 64MB

# maintenance_work_mem: For VACUUM, CREATE INDEX, ALTER TABLE.
# Larger = faster maintenance during off-peak.
maintenance_work_mem = 2GB

# Huge pages: reduces TLB misses. Requires OS config.
# Set vm.nr_hugepages in /etc/sysctl.conf.
huge_pages = try


# --------------------------------------------------------------------------
# WAL (Write-Ahead Log) — critical for write throughput
# --------------------------------------------------------------------------

# WAL level: logical enables CDC/replication if needed later.
wal_level = logical

# WAL buffers: 64MB for high write throughput.
# Default is ~16MB. Increase for bursty writes.
wal_buffers = 64MB

# min_wal_size / max_wal_size: Controls WAL file recycling.
# Larger = fewer WAL file creations during burst writes.
min_wal_size = 1GB
max_wal_size = 8GB

# synchronous_commit: 'on' for data safety. Do NOT set to 'off'
# for production — exam data is irreplaceable.
# For load testing ONLY, you may set 'off' to measure raw throughput.
synchronous_commit = on

# wal_compression: Reduces WAL I/O at the cost of CPU.
# Modern CPUs handle this easily. Significant benefit for write bursts.
wal_compression = lz4

# full_page_writes: Required for crash safety. Do not disable.
full_page_writes = on


# --------------------------------------------------------------------------
# Checkpoints — balance between write performance and recovery time
# --------------------------------------------------------------------------

# checkpoint_timeout: Longer = fewer checkpoints = better write perf,
# but longer crash recovery.
# 15 min for write-heavy workload.
checkpoint_timeout = 15min

# checkpoint_completion_target: Spread checkpoint I/O over this
# fraction of the checkpoint interval. 0.9 = smooth I/O.
checkpoint_completion_target = 0.9

# max_wal_size triggers a checkpoint when WAL exceeds this.
# Already set above at 8GB.


# --------------------------------------------------------------------------
# Background writer & autovacuum
# --------------------------------------------------------------------------

# bgwriter: Flush dirty pages proactively to reduce checkpoint spikes.
bgwriter_delay = 50ms
bgwriter_lru_maxpages = 200
bgwriter_lru_multiplier = 4.0

# Autovacuum: Tune for append-heavy tables (score_events, chat_messages).
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.02

# Vacuum cost-based delay: Prevent vacuum from starving write I/O.
vacuum_cost_delay = 10ms
vacuum_cost_limit = 1000


# --------------------------------------------------------------------------
# Query planner
# --------------------------------------------------------------------------

# random_page_cost: Lower for SSD (default 4.0 is for spinning disk).
random_page_cost = 1.1

# effective_io_concurrency: NVMe SSD can handle many concurrent reads.
effective_io_concurrency = 200

# JIT compilation: Disable for OLTP workload.
# JIT adds compilation overhead that rarely pays off for short queries.
jit = off


# --------------------------------------------------------------------------
# Parallel queries
# --------------------------------------------------------------------------

# Allow parallel queries for teacher-bff aggregate reads.
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_parallel_maintenance_workers = 4
parallel_leader_participation = on


# --------------------------------------------------------------------------
# Logging (production)
# --------------------------------------------------------------------------

# Log slow queries for performance analysis.
log_min_duration_statement = 500    # Log queries slower than 500ms
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0                  # Log all temp file usage

# Statement statistics for pg_stat_statements.
shared_preload_libraries = 'pg_stat_statements,timescaledb'
pg_stat_statements.track = all
pg_stat_statements.max = 10000


# --------------------------------------------------------------------------
# Row-Level Security performance
# --------------------------------------------------------------------------

# RLS policies add a filter to every query. Ensure the planner can
# use tenant_id indexes efficiently.
# NOTE: Every table MUST have an index on (tenant_id) or a composite
# index starting with tenant_id.
#
# Example index:
#   CREATE INDEX idx_scores_tenant ON scores (tenant_id, exam_id, student_id);


# --------------------------------------------------------------------------
# Connection pooling (external — PgBouncer recommended)
# --------------------------------------------------------------------------
#
# For 12 microservices each maintaining connection pools, PgBouncer
# in front of PostgreSQL is strongly recommended:
#
#   [pgbouncer]
#   pool_mode = transaction
#   max_client_conn = 1000
#   default_pool_size = 20
#   reserve_pool_size = 5
#   reserve_pool_timeout = 3
#   server_idle_timeout = 300
#
# This allows 1000 application connections to share 200 actual PG
# connections, dramatically reducing PG process overhead.
