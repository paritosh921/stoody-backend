[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exampen-common"
version = "0.1.0"
description = "Shared Python utilities for ExamPen backend services"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "aiohttp>=3.9,<4",
    "asyncpg>=0.29,<1",
    "cryptography>=42,<44",
    "fastapi>=0.111,<1",
    "nats-py>=2.7,<3",
    "pyjwt[crypto]>=2.8,<3",
    "python-json-logger>=2.0,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "aioresponses>=0.7,<1",
    "coverage>=7,<8",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
