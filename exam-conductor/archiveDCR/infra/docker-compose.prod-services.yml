# ExamPen — Production Backend Services (overlay on docker-compose.prod.yml)
x-svc: &svc
  restart: unless-stopped
  logging: { driver: json-file, options: { max-size: "25m", max-file: "5" } }
  deploy: { resources: { limits: { cpus: "0.5", memory: 512M }, reservations: { cpus: "0.25", memory: 128M } } }
  networks: [exampen-net]
x-env: &env
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_USER: exampen
  NATS_URL: tls://nats:4222
  MINIO_URL: https://minio:9000
  REDIS_URL: rediss://redis:6379/0
  AUTH_SERVICE_URL: http://svc-auth:8000
  LOG_LEVEL: warning
  LOG_FORMAT: json
x-hc: &hc { interval: 15s, timeout: 5s, retries: 3, start_period: 20s }
x-sec-db: &sec-db [postgres_password, redis_password]
x-sec-full: &sec-full [postgres_password, redis_password, minio_root_password]
services:
  svc-auth:
    <<: *svc
    build: ../services/svc-auth
    environment: { <<: *env, DATABASE_NAME: exampen_auth }
    secrets: [postgres_password, redis_password, jwt_signing_key, minio_root_password]
    depends_on: [postgres, nats, redis]
    healthcheck: { <<: *hc, test: ["CMD", "curl", "-sf", "http://localhost:8000/health"] }
  svc-exam-orch:
    <<: *svc
    build: ../services/svc-exam-orch
    environment: { <<: *env, DATABASE_NAME: exampen_exam }
    secrets: *sec-db
    depends_on: [postgres, nats, redis, svc-auth]
    healthcheck: { <<: *hc, test: ["CMD", "curl", "-sf", "http://localhost:8001/health"] }
  svc-stroke-ingest:
    <<: *svc
    build: ../services/svc-stroke-ingest
    environment: { <<: *env, DATABASE_NAME: exampen_stroke }
    secrets: *sec-full
    depends_on: [postgres, nats, minio, redis]
    healthcheck: { <<: *hc, test: ["CMD", "curl", "-sf", "http://localhost:8002/health"] }
  svc-stroke-proc:
    <<: *svc
    build: ../services/svc-stroke-proc
    environment: { <<: *env, DATABASE_NAME: exampen_stroke }
    secrets: *sec-db
    depends_on: [postgres, nats, redis]
    healthcheck: { <<: *hc, test: ["CMD", "curl", "-sf", "http://localhost:8003/health"] }
  svc-doc-assembly:
    <<: *svc
    build: ../services/svc-doc-assembly
    environment: { <<: *env, DATABASE_NAME: exampen_exam }
    secrets: *sec-full
    depends_on: [postgres, nats, minio, redis]
    healthcheck: { <<: *hc, test: ["CMD", "curl", "-sf", "http://localhost:8004/health"] }
  svc-ai-pipeline:
    <<: *svc
    build: ../services/svc-ai-pipeline
    environment: { <<: *env, DATABASE_NAME: exampen_exam }
    secrets: *sec-full
    depends_on: [postgres, nats, minio, redis]
    deploy: { resources: { limits: { cpus: "2.0", memory: 4G }, reservations: { cpus: "1.0", memory: 2G } } }
    healthcheck: { <<: *hc, test: ["CMD", "curl", "-sf", "http://localhost:8005/health"] }
  svc-score-engine:
    <<: *svc
    build: ../services/svc-score-engine
    environment: { <<: *env, DATABASE_NAME: exampen_score }
    secrets: *sec-db
    depends_on: [postgres, nats, redis]
    healthcheck: { <<: *hc, test: ["CMD", "curl", "-sf", "http://localhost:8006/health"] }
  svc-review:
    <<: *svc
    build: ../services/svc-review
    environment: { <<: *env, DATABASE_NAME: exampen_review }
    secrets: *sec-db
    depends_on: [postgres, nats, redis]
    healthcheck: { <<: *hc, test: ["CMD", "curl", "-sf", "http://localhost:8007/health"] }
  svc-analytics:
    <<: *svc
    build: ../services/svc-analytics
    environment: { <<: *env, DATABASE_NAME: exampen_analytics }
    secrets: *sec-db
    depends_on: [postgres, nats, redis]
    healthcheck: { <<: *hc, test: ["CMD", "curl", "-sf", "http://localhost:8008/health"] }
  svc-plagiarism:
    <<: *svc
    build: ../services/svc-plagiarism
    environment: { <<: *env, DATABASE_NAME: exampen_plagiarism }
    secrets: *sec-db
    depends_on: [postgres, nats, redis]
    healthcheck: { <<: *hc, test: ["CMD", "curl", "-sf", "http://localhost:8009/health"] }
  svc-chat:
    <<: *svc
    build: ../services/svc-chat
    environment: { <<: *env, DATABASE_NAME: exampen_chat }
    secrets: *sec-db
    depends_on: [postgres, nats, redis]
    healthcheck: { <<: *hc, test: ["CMD", "curl", "-sf", "http://localhost:8010/health"] }
  svc-notify:
    <<: *svc
    build: ../services/svc-notify
    environment: { <<: *env, DATABASE_NAME: exampen_notify }
    secrets: [postgres_password, redis_password, smtp_password, webhook_secret]
    depends_on: [postgres, nats, redis]
    healthcheck: { <<: *hc, test: ["CMD", "curl", "-sf", "http://localhost:8011/health"] }
  svc-copy-upload:
    <<: *svc
    build: ../services/svc-copy-upload
    environment: { <<: *env, DATABASE_NAME: exampen_copy }
    secrets: *sec-full
    depends_on: [postgres, nats, minio, redis]
    healthcheck: { <<: *hc, test: ["CMD", "curl", "-sf", "http://localhost:8012/health"] }
  svc-teacher-bff:
    <<: *svc
    build: ../services/svc-teacher-bff
    environment:
      <<: *env
      SCORE_ENGINE_URL: http://svc-score-engine:8006
      ANALYTICS_URL: http://svc-analytics:8008
      REVIEW_URL: http://svc-review:8007
      PLAGIARISM_URL: http://svc-plagiarism:8009
      CHAT_URL: http://svc-chat:8010
    secrets: [redis_password]
    depends_on: [redis]
    healthcheck: { <<: *hc, test: ["CMD", "curl", "-sf", "http://localhost:8013/health"] }
  svc-student-bff:
    <<: *svc
    build: ../services/svc-student-bff
    environment:
      <<: *env
      SCORE_ENGINE_URL: http://svc-score-engine:8006
      ANALYTICS_URL: http://svc-analytics:8008
      REVIEW_URL: http://svc-review:8007
      CHAT_URL: http://svc-chat:8010
    secrets: [redis_password]
    depends_on: [redis]
    healthcheck: { <<: *hc, test: ["CMD", "curl", "-sf", "http://localhost:8014/health"] }
  svc-invig-console:
    <<: *svc
    build: ../services/svc-invig-console
    environment: { <<: *env, EXAM_ORCH_URL: "http://svc-exam-orch:8001" }
    secrets: [redis_password]
    depends_on: [nats, redis]
    healthcheck: { <<: *hc, test: ["CMD", "curl", "-sf", "http://localhost:8015/health"] }
secrets:
  postgres_password: { external: true }
  redis_password: { external: true }
  minio_root_password: { external: true }
  jwt_signing_key: { external: true }
  smtp_password: { external: true }
  webhook_secret: { external: true }