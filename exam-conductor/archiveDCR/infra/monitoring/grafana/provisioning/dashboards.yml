# =============================================================
# Grafana — Dashboard Provider Configuration
# =============================================================

apiVersion: 1

providers:
  - name: ExamPen
    orgId: 1
    folder: ExamPen
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
