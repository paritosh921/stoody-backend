# =============================================================
# Prometheus — Alerting Rules
# Derived from FAILURE_MITIGATION_REGISTER.md detection needs
# =============================================================

groups:
  - name: exampen_http
    rules:
      - alert: HighErrorRate
        expr: >
          sum(rate(http_requests_total{status=~"5.."}[2m]))
          /
          sum(rate(http_requests_total[2m]))
          > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "5xx error rate above 5% for 2 minutes"
          description: >
            {{ $labels.job }}: {{ $value | humanizePercentage }}
            error rate.

      - alert: HighLatency
        expr: >
          histogram_quantile(0.99,
            sum(rate(http_request_duration_seconds_bucket[5m]))
            by (le, job)
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p99 latency above 2s for 5 minutes"
          description: >
            {{ $labels.job }}: p99 =
            {{ $value | humanizeDuration }}.

  - name: exampen_nats
    rules:
      - alert: NATSConsumerLag
        expr: >
          nats_consumer_num_pending > 0
          and
          nats_consumer_ack_floor_stream_seq
          < nats_consumer_delivered_stream_seq - 100
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "NATS consumer lag exceeds threshold"
          description: >
            Consumer {{ $labels.consumer }} on stream
            {{ $labels.stream }} has significant lag.

  - name: exampen_database
    rules:
      - alert: DatabaseConnectionExhausted
        expr: >
          pg_stat_activity_count
          /
          pg_settings_max_connections
          > 0.9
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "DB connection pool above 90%"
          description: >
            PostgreSQL connections at
            {{ $value | humanizePercentage }} capacity.

  - name: exampen_hub
    rules:
      - alert: HubOffline
        expr: >
          up{job=~"hub-.*"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Hub health check failing for 5 minutes"
          description: >
            Hub {{ $labels.instance }} is unreachable.

  - name: exampen_pipeline
    rules:
      - alert: StrokeIngestionStalled
        expr: >
          rate(stroke_ingestion_total[5m]) == 0
          and
          nats_consumer_num_pending{stream="STROKES"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Stroke ingestion stalled with pending"
          description: >
            No strokes processed in 5m despite pending
            messages.

      - alert: AIProcessingSlow
        expr: >
          histogram_quantile(0.95,
            rate(ai_processing_duration_seconds_bucket[10m])
          ) > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "AI processing p95 above 30 seconds"
          description: >
            AI pipeline p95 = {{ $value | humanizeDuration }}.
