# =============================================================
# Prometheus — Scrape Configuration
# =============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []   # Add alertmanager:9093 when ready

scrape_configs:
  # --- Infrastructure ---
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: traefik
    static_configs:
      - targets: ["traefik:8080"]

  - job_name: nats
    static_configs:
      - targets: ["nats:8222"]
    metrics_path: /varz

  # --- Backend services (uncomment as deployed) ---
  - job_name: svc-auth
    static_configs:
      - targets: ["svc-auth:8000"]
    metrics_path: /metrics

  - job_name: svc-exam-orch
    static_configs:
      - targets: ["svc-exam-orch:8001"]
    metrics_path: /metrics

  - job_name: svc-stroke-ingest
