    ports: ["4013:4010"]
    volumes: [../new-docs/api/score-engine.openapi.yaml:/spec.yaml:ro]

  mock-review:
    <<: *prism
    ports: ["4014:4010"]
    volumes: [../new-docs/api/review.openapi.yaml:/spec.yaml:ro]

  mock-analytics:
