# ============================================================================
# chrony.conf — NTP Client Configuration for ExamPen Hub (Raspberry Pi)
#
# Installed to: /etc/chrony/chrony.conf
#
# The hub requires accurate time for:
#   - Exam timer correctness (CLOCK_MONOTONIC for countdown, wall clock
#     for timestamps in interaction_log and stroke metadata)
#   - Upload chunk ordering and deduplication on the server
#   - TLS certificate validation for backend HTTPS connections
#
# The hub operates in NTP client mode only — it does not serve time.
# On boot, chrony will step the clock if drift exceeds 1 second, then
# slew gradually for smaller corrections.
# ============================================================================

# ── NTP Servers ────────────────────────────────────────────────────────────
# Use Ubuntu's NTP pool as primary (reliable, geographically distributed)
pool ntp.ubuntu.com        iburst maxsources 4

# Google and Cloudflare as fallback (anycast, low latency)
server time.google.com     iburst prefer
server time.cloudflare.com iburst

# ── Clock Discipline ──────────────────────────────────────────────────────
# Allow a large initial correction on first boot (RPi has no RTC battery;
# clock may be far off after power loss)
makestep 1.0 3

# After 3 steps, switch to slew-only mode for stability
# (slew rate limited to 500 ppm by default)

# ── RTC Handling ──────────────────────────────────────────────────────────
# RPi 4B has no hardware RTC; RPi 5 has one but may not have battery.
# Persist last known time to file so clock starts reasonably close
# after reboot even without network.
driftfile /var/lib/chrony/chrony.drift

# Save NTP measurements for faster sync after restart
dumpdir /var/lib/chrony

# Record last good time; on reboot without NTP, start from this
# rather than epoch 0 or build date
rtconutc
rtcsync

# ── Access Control ────────────────────────────────────────────────────────
# Deny all NTP client access — hub is client only, not a server
deny all

# Allow chronyc commands from localhost only
bindcmdaddress 127.0.0.1
bindcmdaddress ::1

# ── Logging ───────────────────────────────────────────────────────────────
# Log clock adjustments, tracking, and measurement info
log tracking measurements statistics
logdir /var/log/chrony

# ── Leap Second Handling ──────────────────────────────────────────────────
# Apply leap second correction by slewing (not stepping)
leapsecmode slew
maxslewrate 1000
