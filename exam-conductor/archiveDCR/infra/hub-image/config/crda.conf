# ============================================================================
# crda.conf — WiFi Regulatory Domain Configuration
#
# Installed to: /etc/default/crda
#
# Sets the WiFi regulatory domain to US. This determines which WiFi
# channels and power levels are legally permitted.
#
# US WiFi band availability (per HUB_DEPLOYMENT_SPEC §1.2):
#   2.4 GHz:       Channels 1–11,  max 30 dBm
#   5 GHz UNII-1:  Channels 36–48, max 23 dBm (indoor, primary for hub)
#   5 GHz UNII-3:  Channels 149–165, max 30 dBm (alternative)
#
# WARNING: This value is LOCKED to US. The TUI setup screen does not
# expose region selection — it is baked into the golden image.
# Do NOT change this value.
# ============================================================================

REGDOMAIN=US
