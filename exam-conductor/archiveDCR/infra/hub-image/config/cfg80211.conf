# ============================================================================
# cfg80211.conf — Kernel WiFi Regulatory Domain Module Option
#
# Installed to: /etc/modprobe.d/cfg80211.conf
#
# Persists the WiFi regulatory domain at the kernel driver level.
# This ensures the correct regulatory rules are applied at module load
# time, before userspace tools like crda or iw can set them.
#
# This works in conjunction with:
#   /etc/default/crda          — userspace CRDA config (REGDOMAIN=US)
#   iw reg set US              — runtime regulatory set (done by NetworkManager)
#
# WARNING: This value is LOCKED to US per HUB_DEPLOYMENT_SPEC §1.2.
# Do NOT change this value.
# ============================================================================

options cfg80211 ieee80211_regdom=US
