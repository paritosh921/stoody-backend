# ============================================================================
# exampen-bluetooth.conf — BlueZ Configuration Overrides for ExamPen Hub
#
# This file is installed to /etc/bluetooth/exampen.conf and provides
# BlueZ daemon tuning for the exam pen BLE use case:
#   - 5 USB BLE dongles × 8 pens = 40 concurrent connections
#   - P05 pen GATT service 0000ae30-...
#   - High-throughput chunk transfer during post-exam sync
#
# The main BlueZ config is at /etc/bluetooth/main.conf. This file
# contains supplementary settings loaded via drop-in or manual merge.
# ============================================================================

# ── General Settings ───────────────────────────────────────────────────────
# These values should be merged into /etc/bluetooth/main.conf [General]

[General]
# Device name visible during BLE operations
Name = ExamPen-Hub

# Enable BLE (LE) support — required for pen communication
ControllerMode = le

# Allow the hub to manage multiple adapters (5 USB dongles)
MultiProfile = multiple

# Increase the maximum number of simultaneous LE connections
# Default is often 7; we need 8 per dongle × 5 dongles = 40 total
# Note: actual limit depends on adapter firmware; this sets the daemon limit
MaxConnections = 50

# Disable pairing/bonding — pens use unauthenticated BLE
# (no pairing required for GATT read/write on pen service)
PairableTimeout = 0
Pairable = false

# Keep devices in cache for rapid reconnection during exam sync
TemporaryTimeout = 0

# ── LE (Low Energy) Settings ──────────────────────────────────────────────

[LE]
# Minimum and maximum connection interval in units of 1.25 ms
# Lower intervals = faster data transfer, higher power consumption
# 7.5 ms to 15 ms range for fast chunk sync
MinConnectionInterval = 6
MaxConnectionInterval = 12

# Connection latency — number of events the peripheral can skip
# Set to 0 for exam sync (we need every event)
ConnectionLatency = 0

# Supervision timeout in units of 10 ms
# 2000 ms (200 × 10 ms) — detect disconnection within 2 seconds
SupervisionTimeout = 200

# Advertising interval is not relevant for hub (hub is central, not peripheral)
# Pens advertise; hub scans and connects

# ── GATT Settings ─────────────────────────────────────────────────────────

[GATT]
# Increase MTU for faster chunk transfer
# Standard BLE MTU is 23; request 512 for bulk data
# Actual negotiated MTU depends on pen firmware support
ExchangeMTU = 512

# ── Policy Settings ───────────────────────────────────────────────────────

[Policy]
# Auto-enable adapters on startup
AutoEnable = true

# Reconnect attempts for known devices
ReconnectAttempts = 3
ReconnectIntervals = 1,2,4
