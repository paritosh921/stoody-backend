# =============================================================
# ExamPen — Docker Secrets Definition (template)
# Usage: Copy this file. Replace file paths with actual secret
# file locations or switch to external secret manager.
#
# Create secrets:
#   echo "my_password" | docker secret create postgres_password -
#   echo "my_password" | docker secret create redis_password -
#   echo "my_password" | docker secret create minio_root_password -
#   echo "my_password" | docker secret create nats_password -
#   echo "my_jwt_key"  | docker secret create jwt_signing_key -
#   echo "my_smtp_pw"  | docker secret create smtp_password -
#   echo "my_webhook"  | docker secret create webhook_secret -
#   echo "my_s3_key"   | docker secret create s3_access_key -
#   echo "my_s3_sec"   | docker secret create s3_secret_key -
#   echo "my_stoody"   | docker secret create stoody_webhook_secret -
#
# For non-Swarm (compose v2), use file-based secrets below.
# =============================================================

secrets:
  # --- Database ---
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt

  # --- Object Storage ---
  minio_root_password:
    file: ./secrets/minio_root_password.txt
  s3_access_key:
    file: ./secrets/s3_access_key.txt
  s3_secret_key:
    file: ./secrets/s3_secret_key.txt

  # --- Messaging ---
  nats_password:
    file: ./secrets/nats_password.txt

  # --- Auth ---
  jwt_signing_key:
    file: ./secrets/jwt_signing_key.txt
  stoody_webhook_secret:
    file: ./secrets/stoody_webhook_secret.txt

  # --- Notifications ---
  smtp_password:
    file: ./secrets/smtp_password.txt
  webhook_secret:
    file: ./secrets/webhook_secret.txt
