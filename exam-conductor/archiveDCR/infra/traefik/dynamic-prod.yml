# Traefik — Production Dynamic Routing + Middleware

http:
  middlewares:
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        contentTypeNosniff: true
        frameDeny: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        customResponseHeaders:
          X-Powered-By: ""
          Server: ""
    rate-limit:
      rateLimit: { average: 100, burst: 200, period: 1s }
    rate-limit-ingest:
      rateLimit: { average: 500, burst: 1000, period: 1s }

  routers:
    svc-auth:
      rule: "PathPrefix(`/api/v1/auth`)"
      service: svc-auth
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt }
    svc-exam-orch:
      rule: "PathPrefix(`/api/v1/exams`)"
      service: svc-exam-orch
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt }
    svc-stroke-ingest:
      rule: "PathPrefix(`/api/v1/strokes/ingest`)"
      service: svc-stroke-ingest
      entryPoints: [websecure]
      middlewares: [rate-limit-ingest]
      tls: { certResolver: letsencrypt }
    svc-stroke-proc:
      rule: "PathPrefix(`/api/v1/strokes/proc`)"
      service: svc-stroke-proc
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt }
    svc-doc-assembly:
      rule: "PathPrefix(`/api/v1/documents`)"
      service: svc-doc-assembly
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt }
    svc-ai-pipeline:
      rule: "PathPrefix(`/api/v1/ai`)"
      service: svc-ai-pipeline
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt }
    svc-score-engine:
      rule: "PathPrefix(`/api/v1/scores`)"
      service: svc-score-engine
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt }
    svc-review:
      rule: "PathPrefix(`/api/v1/reviews`)"
      service: svc-review
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt }
    svc-analytics:
      rule: "PathPrefix(`/api/v1/analytics`)"
      service: svc-analytics
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt }
    svc-plagiarism:
      rule: "PathPrefix(`/api/v1/plagiarism`)"
      service: svc-plagiarism
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt }
    svc-chat:
      rule: "PathPrefix(`/api/v1/chat`)"
      service: svc-chat
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt }
    svc-notify:
      rule: "PathPrefix(`/api/v1/notifications`)"
      service: svc-notify
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt }
    svc-copy-upload:
      rule: "PathPrefix(`/api/v1/copies`)"
      service: svc-copy-upload
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt }
    svc-teacher-bff:
      rule: "PathPrefix(`/api/v1/teacher`)"
      service: svc-teacher-bff
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt }
    svc-student-bff:
      rule: "PathPrefix(`/api/v1/student`)"
      service: svc-student-bff
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt }
    svc-invig-console:
      rule: "PathPrefix(`/api/v1/invigilator`)"
      service: svc-invig-console
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt }

  services:
    svc-auth: { loadBalancer: { servers: [{ url: "http://svc-auth:8000" }] } }
    svc-exam-orch: { loadBalancer: { servers: [{ url: "http://svc-exam-orch:8001" }] } }
    svc-stroke-ingest: { loadBalancer: { servers: [{ url: "http://svc-stroke-ingest:8002" }] } }
    svc-stroke-proc: { loadBalancer: { servers: [{ url: "http://svc-stroke-proc:8003" }] } }
    svc-doc-assembly: { loadBalancer: { servers: [{ url: "http://svc-doc-assembly:8004" }] } }
    svc-ai-pipeline: { loadBalancer: { servers: [{ url: "http://svc-ai-pipeline:8005" }] } }
    svc-score-engine: { loadBalancer: { servers: [{ url: "http://svc-score-engine:8006" }] } }
    svc-review: { loadBalancer: { servers: [{ url: "http://svc-review:8007" }] } }
    svc-analytics: { loadBalancer: { servers: [{ url: "http://svc-analytics:8008" }] } }
    svc-plagiarism: { loadBalancer: { servers: [{ url: "http://svc-plagiarism:8009" }] } }
    svc-chat: { loadBalancer: { servers: [{ url: "http://svc-chat:8010" }] } }
    svc-notify: { loadBalancer: { servers: [{ url: "http://svc-notify:8011" }] } }
    svc-copy-upload: { loadBalancer: { servers: [{ url: "http://svc-copy-upload:8012" }] } }
    svc-teacher-bff: { loadBalancer: { servers: [{ url: "http://svc-teacher-bff:8013" }] } }
    svc-student-bff: { loadBalancer: { servers: [{ url: "http://svc-student-bff:8014" }] } }
    svc-invig-console: { loadBalancer: { servers: [{ url: "http://svc-invig-console:8015" }] } }
