# =============================================================
# Traefik — Production Static Configuration
# TLS via Let's Encrypt, rate limiting, security headers
# =============================================================

api:
  dashboard: false               # Disabled in production

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
      middlewares:
        - security-headers@file
        - rate-limit@file

certificatesResolvers:
  letsencrypt:
    acme:
      email: "${ACME_EMAIL}"
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: exampen-net
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

log:
  level: WARN
  format: json

accessLog:
  format: json
  filters:
    statusCodes: ["400-599"]
    retryAttempts: true

metrics:
  prometheus:
    addEntryPointsLabels: true
    addServicesLabels: true
    addRoutersLabels: true
