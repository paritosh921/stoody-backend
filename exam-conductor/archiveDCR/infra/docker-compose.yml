# =============================================================
# ExamPen — Dev Stack: core infrastructure
# Usage: docker compose up
# Add monitoring: docker compose -f docker-compose.yml \
#   -f docker-compose.monitoring.yml up
# =============================================================
version: "3.8"

x-service-env: &service-env
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_USER: ${POSTGRES_USER:-exampen}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-exampen_dev}
  NATS_URL: nats://nats:4222
  MINIO_URL: http://minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-exampen}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-exampen_minio_dev}
  REDIS_URL: redis://:${REDIS_PASSWORD:-exampen_redis_dev}@redis:6379/0
  AUTH_SERVICE_URL: http://svc-auth:8000

services:
  # --- PostgreSQL 16 + TimescaleDB ---
  postgres:
    image: timescale/timescaledb:latest-pg16
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exampen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exampen_dev}
      POSTGRES_DB: exampen_auth
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exampen"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [exampen-net]

  # --- NATS JetStream ---
  nats:
    image: nats:2-alpine
    command: >
      --jetstream --store_dir /data --http_port 8222
    ports: ["4222:4222", "8222:8222"]
    volumes: [natsdata:/data]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [exampen-net]

  # --- MinIO (S3-compatible) ---
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-exampen}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-exampen_minio_dev}
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [exampen-net]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set ep http://minio:9000
        $${MINIO_ROOT_USER:-exampen}
        $${MINIO_ROOT_PASSWORD:-exampen_minio_dev} &&
      mc mb --ignore-existing ep/exampen-pages &&
      mc mb --ignore-existing ep/exampen-copies &&
      echo 'Buckets created' && exit 0
      "
    networks: [exampen-net]

  # --- Redis ---
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-exampen_redis_dev}
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a",
             "${REDIS_PASSWORD:-exampen_redis_dev}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [exampen-net]

  # --- Traefik reverse proxy ---
  traefik:
    image: traefik:v3
    ports: ["80:80", "443:443", "8080:8080"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [exampen-net]

volumes:
  pgdata:
  natsdata:
  miniodata:
  redisdata:

networks:
  exampen-net:
    driver: bridge
