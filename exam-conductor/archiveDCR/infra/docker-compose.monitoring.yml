# =============================================================
# ExamPen — Monitoring Stack (Prometheus, Grafana, Loki, Tempo)
# Usage: docker compose -f docker-compose.yml \
#        -f docker-compose.monitoring.yml up
# =============================================================
version: "3.8"

services:
  prometheus:
    image: prom/prometheus:v2
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    command: >
      --config.file=/etc/prometheus/prometheus.yml
      --web.enable-lifecycle
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [exampen-net]

  grafana:
    image: grafana/grafana:11
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki, tempo]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [exampen-net]

  loki:
    image: grafana/loki:3
    ports: ["3100:3100"]
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [exampen-net]

  tempo:
    image: grafana/tempo:2
    ports: ["3200:3200"]
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./monitoring/tempo.yml:/etc/tempo/tempo.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [exampen-net]

  promtail:
    image: grafana/promtail:3
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    networks: [exampen-net]

networks:
  exampen-net:
    external: true
    name: infra_exampen-net
