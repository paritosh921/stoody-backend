# =============================================================
# ExamPen — Test Isolation Stack
# Usage: docker compose -f docker-compose.yml \
#        -f docker-compose.test.yml up -d
# Ephemeral: no persistent volumes, separate ports.
# =============================================================
version: "3.8"

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: exampen_test
      POSTGRES_PASSWORD: exampen_test
      POSTGRES_DB: exampen_auth
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exampen_test"]
      interval: 3s
      timeout: 2s
      retries: 10
    networks: [exampen-test-net]

  nats:
    image: nats:2-alpine
    command: >
      --jetstream
      --store_dir /tmp/nats
      --http_port 8222
    ports: ["4223:4222", "8223:8222"]
    tmpfs: ["/tmp/nats"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 3s
      timeout: 2s
      retries: 10
    networks: [exampen-test-net]

  minio:
    image: minio/minio:latest
    command: server /tmp/data --console-address ":9001"
    ports: ["9002:9000", "9003:9001"]
    environment:
      MINIO_ROOT_USER: exampen_test
      MINIO_ROOT_PASSWORD: exampen_test_secret
    tmpfs: ["/tmp/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 2s
      retries: 10
    networks: [exampen-test-net]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set ep http://minio:9000
        exampen_test exampen_test_secret &&
      mc mb --ignore-existing ep/exampen-pages-test &&
      mc mb --ignore-existing ep/exampen-copies-test &&
      exit 0
      "
    networks: [exampen-test-net]

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass exampen_test
    ports: ["6380:6379"]
    tmpfs: ["/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "exampen_test", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
    networks: [exampen-test-net]

networks:
  exampen-test-net:
    driver: bridge
