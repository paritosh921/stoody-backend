# =============================================================
# pgBackRest — Continuous WAL Archival to S3
# Ref: FAILURE_MITIGATION_REGISTER.md A8.5
# RPO target: <1 hour (WAL streaming) + daily full backup
# =============================================================

[global]
# Repository: S3-compatible (MinIO in self-hosted, AWS S3 in cloud)
repo1-type=s3
repo1-path=/exampen-backups
repo1-s3-bucket=exampen-pgbackrest
repo1-s3-endpoint=s3.amazonaws.com
repo1-s3-region=ap-south-1
repo1-s3-key=/run/secrets/s3_access_key
repo1-s3-key-secret=/run/secrets/s3_secret_key

# Encryption at rest (AES-256-CBC)
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=/run/secrets/pgbackrest_cipher_pass

# Retention: 7 full backups, 4 differential
repo1-retention-full=7
repo1-retention-diff=4

# Compression
compress-type=zst
compress-level=3

# Parallel processing
process-max=2

# Logging
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

# TLS for S3
repo1-s3-verify-tls=y

# WAL archival: async for performance
archive-async=y
spool-path=/var/spool/pgbackrest

[exampen]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=exampen

# Scheduled via cron (see retention-cron.yaml):
#   Full backup:   daily at 02:00 UTC
#   Diff backup:   every 6 hours
#   WAL archive:   continuous (triggered by PostgreSQL)
