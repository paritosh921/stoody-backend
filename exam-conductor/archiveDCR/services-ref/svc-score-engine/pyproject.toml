[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "svc-score-engine"
version = "1.0.0"
requires-python = ">=3.12"
description = "Event-sourced scoring service for ExamPen"
dependencies = [
    "exampen-common",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "nats-py>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.28,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: domain-only tests (no I/O)",
    "integration: requires DB / NATS",
]
pythonpath = ["."]
