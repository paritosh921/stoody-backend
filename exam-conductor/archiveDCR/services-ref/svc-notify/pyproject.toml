[project]
name = "svc-notify"
version = "0.1.0"
description = "ExamPen notification service — email, push, SMS triggers on NATS events"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "nats-py>=2.9,<3",
    "aiosmtplib>=3.0,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "unit: pure domain logic, no I/O",
    "integration: requires external services",
]

[tool.ruff]
target-version = "py312"
line-length = 100
