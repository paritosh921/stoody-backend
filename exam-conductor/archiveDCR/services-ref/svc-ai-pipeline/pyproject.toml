[project]
name = "svc-ai-pipeline"
version = "0.1.0"
description = "ExamPen AI recognition pipeline: HWR, step detection, diagram classification"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "nats-py>=2.9.0",
    "asyncpg>=0.30.0",
    "aiobotocore>=2.15.0",
    "onnxruntime>=1.19.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "coverage>=7.6.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (domain logic, no I/O)",
    "integration: Integration tests (requires DB/NATS/S3)",
]
asyncio_mode = "auto"
