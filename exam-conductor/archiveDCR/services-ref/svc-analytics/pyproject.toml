[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "svc-analytics"
version = "0.1.0"
description = "ExamPen analytics service — percentiles, leaderboards, class statistics"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "exampen-common",
    "asyncpg>=0.29,<1",
    "fastapi>=0.111,<1",
    "nats-py>=2.7,<3",
    "pyjwt[crypto]>=2.8,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "httpx>=0.27,<1",
    "coverage>=7,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
