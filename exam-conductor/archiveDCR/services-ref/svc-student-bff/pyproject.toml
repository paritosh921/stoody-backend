[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "svc-student-bff"
version = "0.1.0"
description = "ExamPen student BFF — read-only aggregator for student and parent views"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "exampen-common",
    "aiohttp>=3.9,<4",
    "fastapi>=0.111,<1",
    "pydantic>=2.7,<3",
    "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "httpx>=0.27,<1",
    "coverage>=7,<8",
    "cryptography>=42,<44",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
