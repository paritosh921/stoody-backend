[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "svc-auth"
version = "0.1.0"
description = "ExamPen auth service — Stoody JWT validation, role mapping, revocation"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "exampen-common",
    "aiohttp>=3.9,<4",
    "asyncpg>=0.29,<1",
    "fastapi>=0.111,<1",
    "pyjwt[crypto]>=2.8,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "httpx>=0.27,<1",
    "aioresponses>=0.7,<1",
    "coverage>=7,<8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
