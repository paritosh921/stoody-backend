[project]
name = "svc-copy-upload"
version = "0.1.0"
description = "Fallback photo-based answer capture service for ExamPen"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "miniopy-async>=1.21",
    "nats-py>=2.9.0",
    "python-multipart>=0.0.18",
    "exampen-common @ file:///${PROJECT_ROOT}/../../libs/exampen-common-py",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: pure domain logic tests (no I/O)",
    "integration: tests requiring mocked external deps",
]
